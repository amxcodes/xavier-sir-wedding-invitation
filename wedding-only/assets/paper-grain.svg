<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".018 .62" numOctaves="2" seed="23" stitchTiles="stitch" result="fibres"/>
    <feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="3" seed="11" stitchTiles="stitch" result="grain"/>
    <feBlend in="fibres" in2="grain" mode="multiply" result="texture"/>
    <feColorMatrix in="texture" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncR type="linear" slope=".72" intercept=".14"/>
      <feFuncG type="linear" slope=".72" intercept=".14"/>
      <feFuncB type="linear" slope=".72" intercept=".14"/>
      <feFuncA type="table" tableValues="0 .42"/>
    </feComponentTransfer>
  </filter>
  <rect width="192" height="192" filter="url(#paper)" opacity=".72"/>
</svg>
